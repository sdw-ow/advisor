  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

scribedby=\"rf-what-d\" style=\"height:40px;font:inherit;font-size:14px;border:1px solid #8A8B94;border-radius:4px;padding:0 12px;color:#0A0A0A;background:#FFFFFF;border-color:{{ whatBd }}\" style-focus=\"outline:2px solid #000AD2;outline-offset:2px;border-color:#000AD2\">\n                        <span id=\"rf-what-d\" style=\"font-size:11.5px;color:{{ whatNoteC }}\">{{ whatNote }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:6px\">\n                        <label for=\"rf-size\" style=\"font-size:12.5px;font-weight:500\">How much you have in mind<\u002Flabel>\n                        <sc-raw-select id=\"rf-size\" value=\"{{ rfSize }}\" sc-camel-on-change=\"{{ setSize }}\" style=\"height:40px;font:inherit;font-size:14px;border:1px solid #8A8B94;border-radius:4px;padding:0 12px;color:#0A0A0A;background:#FFFFFF;padding:0 10px\" style-focus=\"outline:2px solid #000AD2;outline-offset:2px;border-color:#000AD2\">\n                          <sc-for list=\"{{ sizeOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <label for=\"rf-twhy\" style=\"font-size:12.5px;font-weight:500\">Why<\u002Flabel>\n                      <textarea id=\"rf-twhy\" rows=\"2\" value=\"{{ rfTWhy }}\" sc-camel-on-change=\"{{ setTWhy }}\" style=\"font:inherit;font-size:14px;line-height:1.5;border:1px solid #8A8B94;border-radius:4px;padding:10px 12px;resize:vertical;color:#0A0A0A\" style-focus=\"outline:2px solid #000AD2;outline-offset:2px;border-color:#000AD2\"><\u002Ftextarea>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"border:1px solid {{ qother.bd }};box-shadow:{{ qother.sh }};background:#FFFFFF\">\n                <button type=\"button\" role=\"checkbox\" aria-checked=\"{{ qother.on }}\" aria-controls=\"rq-other\" sc-camel-on-click=\"{{ qother.click }}\" style=\"width:100%;text-align:left;font:inherit;color:#0A0A0A;background:transparent;border:none;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer\" style-focus=\"outline:2px solid #000AD2;outline-offset:-2px\">\n                  <span aria-hidden=\"true\" style=\"flex:0 0 auto;margin-top:1px;width:18px;height:18px;border-radius:3px;border:1.5px solid {{ qother.cbBd }};background:{{ qother.cbBg }};color:#FFFFFF;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center\">{{ qother.tick }}<\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:15px;font-weight:500\">Other<\u002Fspan><span style=\"font-size:12.5px;color:#4A4A52;line-height:1.45\">Anything the three above don’t cover.<\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ qother.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div id=\"rq-other\" role=\"group\" aria-labelledby=\"rq-oth-h\" style=\"border-top:1px solid #F0F0F3;padding:18px 18px 20px 50px;display:flex;flex-direction:column;gap:16px;animation:dcIn .2s ease-out\">\n                    <div id=\"rq-oth-h\" style=\"font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A72;font-weight:500\">Your requests<\u002Fdiv>\n                    <sc-for list=\"{{ othItems }}\" as=\"o\" hint-placeholder-count=\"1\">\n                      <div role=\"group\" aria-labelledby=\"{{ o.lid }}\" style=\"display:flex;flex-direction:column;gap:6px\">\n                        <label id=\"{{ o.lid }}\" for=\"{{ o.id }}\" style=\"font-size:12.5px;font-weight:500\">{{ o.label }}<\u002Flabel>\n                        <div style=\"display:flex;gap:12px;align-items:center\">\n                          <input id=\"{{ o.id }}\" type=\"text\" value=\"{{ o.v }}\" sc-camel-on-change=\"{{ o.set }}\" aria-invalid=\"{{ o.inv }}\" aria-describedby=\"rf-oth-d\" style=\"height:40px;font:inherit;font-size:14px;border:1px solid #8A8B94;border-radius:4px;padding:0 12px;color:#0A0A0A;background:#FFFFFF;flex:1;min-width:0;border-color:{{ o.bd }}\" style-focus=\"outline:2px solid #000AD2;outline-offset:2px;border-color:#000AD2\">\n                          <sc-if value=\"{{ o.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                            <button type=\"button\" data-btn=\"tertiary\" aria-label=\"{{ o.rmAria }}\" sc-camel-on-click=\"{{ o.remove }}\" style=\"background:none;border:none;border-radius:3px;padding:6px 2px;font:inherit;font-size:12.5px;color:#000AD2;cursor:pointer\">Remove<\u002Fbutton>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <span id=\"rf-oth-d\" style=\"font-size:11.5px;color:{{ othNoteC }}\">{{ othNote }}<\u002Fspan>\n                    <button type=\"button\" data-btn=\"tertiary\" sc-camel-on-click=\"{{ addOther }}\" style=\"align-self:flex-start;background:none;border:none;border-radius:3px;padding:4px 2px;font:inherit;font-size:13px;font-weight:500;color:#000AD2;cursor:pointer\">+ Add another request<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:2px 0 0;font-size:13.5px;line-height:1.5;color:#3A3A42;text-wrap:pretty\">Your Custom Portfolio Manager will come back with what this would mean for the rest of the portfolio. Changes of this kind affect more than the line being changed.<\u002Fp>\n          <\u002Fsection>\n          <div style=\"max-width:920px;display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;border-top:1px solid #E8E9EE;padding-top:16px\">\n            <div role=\"status\" aria-live=\"polite\" style=\"display:flex;flex-direction:column;gap:3px;min-width:0\">\n              <span style=\"font-size:15px;font-weight:500\">{{ reqCount }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#4A4A52;line-height:1.4\">{{ reqList }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end\">\n              <div role=\"alert\" style=\"font-size:13px;color:#0A0A0A;font-weight:500\">{{ sendErr }}<\u002Fdiv>\n              <button type=\"button\" data-btn=\"primary\" sc-camel-on-click=\"{{ doSend }}\" style=\"height:40px;padding:0 18px;border-radius:4px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;background:#000AD2;border:1px solid #000AD2;color:#FFFFFF;display:flex;align-items:center;gap:9px\"><span>Send to Invesco<\u002Fspan><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><polyline points=\"4,1.5 8.5,6 4,10.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px 48px;max-width:920px;align-items:start\">\n            <section aria-labelledby=\"sent-h\" style=\"display:flex;flex-direction:column;gap:10px\">\n              <h2 id=\"sent-h\" style=\"margin:0;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A72;font-weight:500\">{{ sentHead }}<\u002Fh2>\n              <dl style=\"margin:0;display:grid;grid-template-columns:140px minmax(0,1fr);background:#F6F6F8;padding:4px 18px\">\n                <sc-for list=\"{{ sentRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <dt style=\"font-size:12px;color:#4A eristics<\u002Fdiv>\n                        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n                          <sc-for list=\"{{ docChars }}\" as=\"t\" hint-placeholder-count=\"3\"><div><div style=\"font-size:10.5px;color:#6A6A72\">{{ t.label }}<\u002Fdiv><div style=\"font-family:'Editor',Georgia,serif;font-size:20px;font-variant-numeric:tabular-nums\">{{ t.now }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ docHasCmp }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #E8E9EE;padding-top:14px\">\n                        <div style=\"font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A72;font-weight:500\">How this model compares<\u002Fdiv>\n                        <div role=\"img\" aria-label=\"{{ docCmpSay }}\" style=\"display:flex;flex-direction:column;gap:7px\">\n                          <sc-for list=\"{{ docCmp }}\" as=\"b\" hint-placeholder-count=\"2\">\n                            <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr) 150px;gap:10px;align-items:center\">\n                              <span style=\"font-size:11px;color:#3A3A42;line-height:1.3\">{{ b.name }}<\u002Fspan>\n                              <span style=\"display:flex;height:14px\"><sc-for list=\"{{ b.segs }}\" as=\"s\" hint-placeholder-count=\"5\"><span style=\"width:{{ s.w }};background:{{ s.f }};border-right:1px solid #FFFFFF\"><\u002Fspan><\u002Fsc-for><\u002Fspan>\n                              <span style=\"font-size:10.5px;color:#3A3A42;text-align:right;font-variant-numeric:tabular-nums\">{{ b.stats }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n :flex;flex-direction:column;gap:14px\">\n                        <sc-if value=\"{{ sh.cover }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex;align-items:center;gap:10px\">\n                            <span style=\"border:1px dashed #B8B9C2;padding:6px 12px;font-size:10.5px;color:#6A6A72;letter-spacing:.04em\">Practice mark<\u002Fspan>\n                            <span aria-hidden=\"true\" style=\"color:#C6C7CE\">+<\u002Fspan>\n                            <span style=\"border:1px dashed #B8B9C2;padding:6px 12px;font-size:10.5px;color:#6A6A72;letter-spacing:.04em\">Invesco mark<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:28px\">\n                            <div style=\"font-family:'Editor',Georgia,serif;font-size:30px;line-height:1.15;letter-spacing:-0.01em\">{{ docTitle }}<\u002Fdiv>\n                            <div style=\"font-size:12px;color:#6A6A72\">Moderate Income Custom Model · {{ docSub }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;margin-top:18px;max-width:340px\">\n                            <div style=\"font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A72;font-weight:500;margin-bottom:6px\">Contents<\u002Fdiv>\n                            <sc-for list=\"{{ rContents }}\" as=\"c\" hint-placeholder-count=\"5\"><div style=\"display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid #F0F0F3;font-size:12px\"><span>{{ c.n }}<\u002Fspan><span style=\"color:#6A6A72;font-variant-numeric:tabular-nums\">{{ c.p }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ sh.notCover }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"display:flex;justify-content lumns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid #F0F0F3;font-size:11.5px\"><span style=\"color:#3A3A42\">US large-cap equity<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:500\">+4.1%<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid #F0F0F3;font-size:11.5px\"><span style=\"color:#3A3A42\">Global equity ex-US<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:500\">+1.2%<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid #F0F0F3;font-size:11.5px\"><span style=\"color:#3A3A42\">US investment-grade bonds<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:500\">+2.2%<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid #F0F0F3;font-size:11.5px\"><span style=\"color:#3A3A42\">Municipal bonds<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:500\">+1.9%<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid #F0F0F3;font-size:11.5px\"><span style=\"color:#3A3A42\">10-year Treasury yield<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:500\">−0.35 pts<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:9px;line-height:1.45;color:#6A6A72;border-top:1px solid #F0F0F3;padding-top:6px\">Source: Invesco Global Market Strategy, as of 31 December 2026. Index returns in US dollars.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ sh.mmeant }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:11.5px;line-height:1.55;color:#0A0A0A;text-wrap:pretty;color:#3A3A42\">How the quarter’s markets showed up in your model. Figures are each asset class’s contribution to return.<\u002Fp>\n<div style=\"display:fle leeve and funds withdrawals without selling longer bonds at a loss.' },\n  { id: 'faln6', c: 2, w: 3.1, b: [7.2, 5.2, 3.1, 2.2], n: 'iShares Fallen Angels USD Bond ETF', m: 'iShares · index', tk: 'FALN', what: 'Bonds from US companies recently downgraded from investment grade to high yield.', use: 'High-yield income at a higher average credit quality than the broad high-yield market.', here: 'Half of the model’s high-yield exposure — held instead of a traditional high-yield fund, alongside senior loans.' },\n  { id: 'jaaa6', c: 2, w: 3.1, b: [6.6, 4.7, 3.1, 2.0], n: 'Janus Henderson AAA CLO ETF', m: 'Janus Henderson · active', tk: 'JAAA', what: 'AAA-rated tranches of collateralised loan obligations, actively managed.', use: 'Floating-rate income above Treasuries, at the top of the credit structure.', here: 'Lifts the sleeve’s yield without adding interest-rate risk.' },\n  { id: 'tlh6', c: 2, w: 2.7, b: [6.6, 4.6, 2.7, 0], n: 'iShares 10-20 Year Treasury Bond ETF', m: 'iShares · index', tk: 'TLH', what: 'US Treasury bonds maturing in 10 to 20 years, index-weighted.', use: 'Dependable ballast when equities fall sharply.', here: 'Adds duration so the bond sleeve can offset equity sell-offs.' },\n  { id: 'lonz6', c: 2, w: 2.4, b: [5.7, 4.0, 2.4, 0], n: 'PIMCO Sr Ln Actv ETF', m: 'PIMCO · active', tk: 'LONZ', what: 'Floating-rate loans to US companies, mostly below investment grade.', use: 'Senior in the capital structure, with income that rises with rates.', here: 'The other half of the model’s high-yield exposure — chosen over a traditional high-yield fund for its seniority and floating rate.' },\n  { id: 'medix6', c: 2, w: 2.0, b: [2.7, 2.0, 2.0, 0], n: 'MFS Emerging Markets Debt I', m: 'MFS · active', tk: 'MEDIX', what: 'An actively managed portfolio of emerging market government and corporate bonds.', use: 'Higher income, with returns that differ from US credit.', here: 'A small diversifying income position at 2%.' },\n  { id: 'jepix6', c: 3, w: 10.3, b: [0, 10.2, 10.3, 10.3], n: 'JPMorgan Equity Premium Income I', m: 'JPMorgan · active', tk: 'JEPIX', what: 'US large-cap stocks with an options overlay that sells calls to generate monthly income.', use: 'High, regular income with less volatility than the equity market.', here: 'The income engine of the model — and the reason the alternatives sleeve is 10.3%, larger than in a typical 60/40.' },\n  { id: 'usd6', c: 4, w: 3.0, b: [3.0, 3.0, 3.0, 3.0], n: 'USD', m: 'Cash · held at custodian', tk: 'USD', what: 'Cash held at your custodian.', use: 'Liquidity for fees, withdrawals and rebalancing.', here: 'Held at 3% to meet the agreed liquidity target.' }\n];\nconst BANDS = ['20/80', '40/60', '60/40', '80/20'];\nconst HB_NAMES = ['US Equity', 'International Equity', 'Fixed Income', 'Alternatives', 'Cash'];\nconst HB = HB_NAMES.map((name, c) => { const funds = HOLD.filter(h => h.c === c).map(h => ({ h, w: h.b.map(v => Math.round(v * 10)) })); return { name, f: AS[c].f, sub: BANDS.map((_, b) => funds.reduce((x, f) => x + f.w[b], 0)), funds }; });\nconst PROP_A = AS.map((s, k) => Math.round(HOLD.filter(h => h.c === k).reduce((x, h) => x + h.w, 0) * 10) / 10);\nconst NMX = { prop: 'Invesco proposed model', today: 'Your current portfolio', view: 'Invesco reference model', bench: 'Broad 60/40 benchmark' };\nconst COMP = {\n  today: { name: NMX.today, sub: 'Sample shared 18 September · 22 holdings', alloc: [36, 10, 40, 4, 10], ret: 6.0, vol: 10.6, fee: 34, r3: 18.2, dd3: -13.4, lines: 22 },\n  prop: { name: NMX.prop, sub: 'Built to your mandates', alloc: PROP_A, ret: 6.4, vol: 9.1, fee: 21, r3: 22.6, dd3: -9.7, lines: 18 },\n  view: { name: NMX.view, sub: 'What we would have proposed if you hadn’t specified your own constraints', alloc: [34, 18, 37, 8, 3], ret: 6.2, vol: 9.4, fee: 19, r3: 21.4, dd3: -10.4, lines: 15 },\n  bench: { name: NMX.bench, sub: '60% global equity, 40% US aggregate bonds', alloc: [42, 18, 40, 0, 0], ret: 5.7, vol: 10.0, fee: 6, r3: 15.8, dd3: -15.2, lines: 2 }\n};\nconst FIN = { alloc: PROP_A, ret: 6.3, vol: 9.2, fee: 16, te: 2.5 };\nconst PERF = { 1: { today: [8.1, 8.1, 11.2, -6.8], prop: [9.4, 9.4, 9.0, -4.9], view: [9.0, 9.0, 9.3, -5.2], bench: [7.6, 7.6, 10.4, -6.2] }, 3: { today: [18.2, 5.7, 10.9, -13.4], prop: [22.6, 7.0, 8.8, -9.7], view: [21.4, 6.7, 9.2, COMP.view.dd3], bench: [15.8, 5.0, 10.2, -15.2] }, 5: { today: [29.5, 5.3, 11.4, -17.9], prop: [36.1, 6.4, 9.3, -13.2], view: [34.2, 6.1, 9.6, -13.9], bench: [24.9, 4.5, 10.8, -19.6] } };\nconst DIFFS = [\n  { c: 2, t: 'You were running 14% in high-yield credit. The proposal holds 4%.' },\n  { c: 0, t: 'You were overweight small cap at 11%. The proposal holds 6%.' },\n  { c: 2, t: 'Your fixed income sat in 9 line items. The proposal uses 7.' }\n];\nconst FEE_DIFF = 'Fee: 34 bps today, 21 bps proposed.';\nconst T1 = { key: 't1', q: 'Why Hartford Schroders International Stock rather than a cheaper index version?', paras: ['Because it has earned its fee where your clients feel it most — in falling markets.', 'Our manager research team has covered the strategy for over a decade. Over that time it has captured less of the developed-market index’s falls than its rises, net of fees, and it held up better than the index in the 2022 drawdown.', 'The model already holds the index version beside it — iShares Core MSCI EAFE ETF, at 4% — so the sleeve does not rely on one manager. Moving SCIEX into the index would take a few basis points off the model’s fee. For a pre-retiree book, where the order of returns matters, we think the steadier ride is worth more. If fee matters more to you, request the swap and we will show you what it changes.'], src: 'Manager research · Invesco Global Manager Research, strategy review August 2026' };\nconst FOLLOW = [\n  { key: 't2', q: 'What’s my total Apple exposure?', paras: ['2.1% of the whole model — about $3.8m of the $180m mandate. It sits in four funds:'], rows: [{ k: 'iShares Core S&P 500 ETF · 7.0% of the fund', v: '1.6%' }, { k: 'JPMorgan Large Cap Growth I · 4.0% of the fund', v: '0.2%' }, { k: 'Invesco Large Cap Growth ETF · 3.0% of the fund', v: '0.2%' }, { k: 'Invesco S&P 500 Revenue ETF · 2.0% of the fund', v: '0.1%' }], src: 'Holdings look-through · positions as at 30 September 2026' },\n  { key: 't3', q: 'I don’t see any Bitcoin — why not?', paras: ['Because the model is built for income and a steadier ride, and bitcoin offers neither. But you are not entirely without it.', 'Through the US equity funds the model already holds about 0.3% in companies whose fortunes are tied to digital assets — miners, exchanges, and firms that hold bitcoin on their balance sheet.', 'Invesco’s house view treats bitcoin as a satellite: volatile, without income, and diversifying only some of the time. Where clients want it, we would size it at 1–2% and fund it from equity rather than bonds.', 'It can be added. Request a change and your Custom Portfolio Manager will talk through sizing with you before anything moves.'], src: 'Invesco house view · Digital assets, Q3 2026 · Holdings look-through, 30 September 2026' }\n];\nconst HOLD60 = HOLD;\nconst PROP60 = AS.map((s, k) => Math.round(HOLD60.filter(h => h.c === k).reduce((x, h) => x + h.w, 0) * 10) / 10);\nconst TODAY4 = COMP.today.alloc;\nconst T60 = { key: 't60', q: 'Why did Invesco choose Invesco S&P 500 Revenue ETF?', paras: ['Because it gives your clients the US large-cap market without leaning as heavily on its most expensive companies.', 'Our manager research team reviews the strategy as part of the US equity line-up. Weighting by revenue rather than market value tilts it toward companies with large, established sales and away from the most richly valued names — a tilt that has tended to help when market leadership narrows and then reverses.', 'The model holds the market-weighted index beside it — iShares Core S&P 500 ETF, at 15.9% — so the US sleeve does not depend on one approach. At 12.0%, RWL is large enough to moderate the index’s concentration in a handful of mega-cap stocks without moving the sleeve far from the market. If you would rather hold the index alone, request the change and we will show you what it does to the rest of the model.'], src: 'Manager research · Invesco Global Manager Research, US equity strategy review August 2026' };\nconst FOLLOW60 = [\n  { key: 'm1', q: 'Why don’t you have a traditional high-yield bond fund in this model?', paras: ['We’ve chosen to get high-yield exposure through fallen angels and senior loans rather than a traditional high-yield fund. Invesco’s strategic asset-allocation process intentionally tilts away from traditional high yield toward these exposures where we believe they can improve the portfolio’s risk and return characteristics. The sizing and funding of these positions are designed to maintain the intended fixed-income risk profile.'], src: 'Invesco strategic asset allocation · Fixed income positioning, Q3 2026' },\n  { key: 'm2', q: 'What’s my total Apple exposure across the model?', paras: ['1.6% of the whole model — about $2.9m of the $180m mandate. It sits in three funds:'], rows: [{ k: 'iShares Core S&P 500 ETF · 7.0% of the fund', v: '1.1%' }, { k: 'Invesco S&P 500 Revenue ETF · 2.6% of the fund', v: '0.3%' }, { k: 'JPMorgan Equity Premium Income I · 1.7% of the fund', v: '0.2%' }], src: 'Holdings look-through · positions as at 30 September 2026' },\n  Object.assign({}, FOLLOW[1], { key: 'm3' })\n];\nconst SCR_NAMES = ['Your Custom Model is ready', 'Proposed model', 'Choose a portfolio to compare', 'How the proposed model compares', 'Comparison set', 'Performance', 'Request a change', 'Changes sent', 'Updated model', 'Build the proposal', 'Proposal ready', 'Your book against the model', 'Transition analysis', 'Accounts needing a decision', 'This quarter', 'Build the report', 'Report ready'];\nconst QA = {\n  improve: ['How do these changes improve my portfolio?', 'The proposed model reduces your concentration in high-yield bonds, which can experience larger losses when credit conditions deteriorate, and reallocates that exposure across a more diversified mix of fixed-income strategies. It also reduces your cash allocation and increases equity exposure, giving the portfolio greater participation in long-term market growth while remaining within the agreed risk profile. Together, these changes are intended to improve diversification and create a more balanced mix of risks rather than relying as heavily on high-yield credit.', ['High-yield credit', 'Cash 10% → 3%']],\n  why: ['Why does the model hold a revenue-weighted S&P 500 fund?', 'It tempers the index’s concentration in the largest companies, which suits income before growth. It costs 0.39% against a few basis points for the index, so it is the holding most often questioned on fee. If fee matters more to you, you can ask for the index version through Request a change.', ['Invesco S&P 500 Revenue ETF', 'US equity']],\n  prefs: ['Which of my preferences drove this allocation?', 'Two did most of the work. Income before growth set fixed income at 30.7%. Taxable accounts put 12% in municipal bonds and kept the equity in ETFs. Your 20% ceiling on non-US equity did not bind — the model holds 12%.', ['Fixed income 37%', 'Municipal bond ETF']],\n  credit: ['Why is my credit weight a problem?', 'It is not the credit, it is the size. At 14%, high yield was doing equity’s job: in sell-offs it falls with stocks, just when an income portfolio needs ballast. The proposal keeps 4% in senior loans for income and gets the rest from core plus and municipal bonds, which held up far better in 2022.', ['High-yield credit 14% → 4%', 'Senior loan ETF']],\n  rrdrive: ['What is driving the difference in risk and return?', 'The difference comes from several changes rather than a single allocation decision. The proposed model holds less cash and high-yield credit, increases equity exposure, and changes the mix of strategies within each asset class. Together, those changes result in a modeled expected return of 6.4% versus 6.0% today, while reducing modeled volatility from 10.6% to 9.1%.', ['Expected return 6.0% → 6.4%', 'Volatility 10.6% → 9.1%']],\n  driving: ['What is driving the difference in performance?', 'Mostly fixed income. The proposed model’s lower high-yield weight gave up a little in the 2023 rally and lost less in the drawdowns, which is where most of the performance gap opens. Its 13 bps lower fee adds about 0.4 points over three years. Both lines are today’s portfolios run backwards, so read the gap as structural, not as a forecast.', ['High-yield credit', 'Fee 34 → 21 bps']],\n  view: ['What would change without my mandates?', 'We would hold 18% outside the US rather than 11%, add 3% of emerging market debt, and replace the municipal bonds with taxable ones. Expected return would be 0.2 points lower, with 0.3 points more volatility — so the proposal comes out ahead on both, before counting the municipal bonds, which are worth more to your clients after tax than the table shows.', ['Invesco’s view', 'Municipal bond ETF']],\n  legacy: ['Why not sell everything today?', 'You can — that is the immediate option on the next screen. Most of the realised gain sits in two legacy positions bought well below today’s price. Selling them now accounts for about 80% of the tax bill, for 9 points of the move.', ['Realised gains', 'Legacy positions']],\n  approach: ['Which approach suits this book?', 'For most of the 75 accounts, phased over four quarters. It splits the realised gain across two tax years and still has every account on the model within a year. All at once suits a book with little embedded gain, or clients who want to be on the model now. Held under a tax threshold only makes sense if clients would rather sit off target for two years than pay tax this year.', ['Phased over four quarters', 'Held under a tax threshold']],\n  access: ['What exactly can Invesco see?', 'Holdings, values and tax lots for the accounts you connect — enough to work out what each account would need to trade and what it would cost in tax. Not client names or contact details. Nothing is traded: the output is a set of instructions your trading partner executes.', ['Custodian data', 'Read-only']],\n  why6935: [\"Why does account 6935 need review?\", \"It is a $3.1m trust, and 19% of it is a legacy Exxon Mobil position held since the trust was settled. Selling it in full would realise about $353k of gain this tax year, so it is held back for a decision rather than moved automatically. You decide how to treat it — and the other 14 like it — once the ready accounts are planned.\", [\"Account ••6935\",\"Embedded gains\"]],\n  shape: [\"What do the accounts needing review have in common?\", \"All 15 have the same issue: embedded gains. Each holds a legacy fund bought a decade or more ago, where a full sale would realise a large gain this tax year. Because the cause is the same, a single rule can usually handle all of them.\", [\"Embedded gains · 15\",\"Legacy positions\"]],\n  treatAll: ['Should I treat all the embedded-gain accounts the same way?', 'Usually, yes. The gain is the same kind of problem in each, and phasing the legacy position over four quarters splits the tax across two years without holding the account off target for long. Look again at any account where the client needs the cash this year.', ['Phase it separately', 'Embedded gains']],\n  perf: ['What drove performance this quarter?', 'US equity did most of the work — 1.6 of the 2.8 points. Fixed income added 0.8 as yields fell. The model beat the Invesco benchmark model by 0.5 points, about half of it from the lower fee after the index swap.', ['US equity +1.6', 'Index swap']],\n  discuss: ['What should I be prepared to discuss with clients?', 'Two things. Why the model holds less outside the US than many peers — that is your practice’s preference, and it helped this quarter. And the short-duration fund replacement in November: same exposure, slightly cheaper, no action n
